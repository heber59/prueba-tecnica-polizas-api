server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
app:
  api-key: ${API_KEY:123456}
core:
  base-url: ${CORE_BASE_URL:http://localhost:${server.port}}
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
